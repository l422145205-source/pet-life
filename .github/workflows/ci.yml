name: Skill checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Run the Skill example
        run: python scripts/petlife.py build --input assets/household.example.json --as-of 2026-10-03 --trip-days 3 --out work/example
      - name: Reproduce care workflows and receipt replay
        run: python tools/reproduce.py --out work/everyday
      - uses: actions/upload-artifact@v4
        with:
          name: skill-example-${{ matrix.os }}
          path: work/example
